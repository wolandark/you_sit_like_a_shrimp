<title>Sitting Like a Shrimp</title>
<style>
	body {
		margin: 0;
		font-family: system-ui, sans-serif;
		background: #fbeee0;
		color: #4a3728;
		display: flex;
		flex-direction: column;
		align-items: center;
		min-height: 100vh
	}

	h1 {
		font-size: 1.4rem;
		margin: 16px 0 2px;
		letter-spacing: .02em
	}

	.hint {
		font-size: .85rem;
		opacity: .7;
		margin: 2px 0 12px;
		text-align: center;
		padding: 0 12px
	}

	.bar {
		display: flex;
		gap: 8px;
		margin-bottom: 12px;
		flex-wrap: wrap;
		justify-content: center;
		align-items: center
	}

	button,
	label.btn {
		background: #e05a2b;
		color: #fff;
		border: none;
		border-radius: 8px;
		padding: 8px 14px;
		font-size: .9rem;
		cursor: pointer;
		font-family: inherit
	}

	button:hover,
	label.btn:hover {
		background: #c34a20
	}

	button.pick {
		background: #8a6d5a
	}

	button.pick.on {
		background: #e05a2b
	}

	input[type=file] {
		display: none
	}

	canvas {
		width: min(94vw, 900px);
		height: auto;
		background: #fff;
		border-radius: 12px;
		box-shadow: 0 4px 20px rgba(74, 55, 40, .2);
		touch-action: none;
		margin-bottom: 20px
	}

</style>
<h1>🦐 Sitting Like a Shrimp</h1>
<p class="hint">drag the dots to pose the shrimp · drag its body to move it · add a photo, pose, download</p>
<div class="bar">
	<button class="pick on" id="pk-photo">Photo shrimp</button>
	<button class="pick" id="pk-cartoon">Cartoon shrimp</button>
	<label class="btn">Background photo<input type="file" id="file" accept="image/*"></label>
	<label>size <input type="range" id="size" min="0.4" max="2.2" step="0.05" value="1"></label>
	<label>rotate <input type="range" id="rot" min="-180" max="180" step="1" value="0"></label>
	<button id="reset">Reset pose</button>
	<button id="save">Download PNG</button>
</div>
<div class="bar" style="width:min(94vw,900px)">
	<input id="cap" type="text" value="me thinking I look nonchalant but this is my posture"
		style="flex:1;padding:8px 12px;border:1.5px solid #c9a; border-color:#d8c3b0;border-radius:8px;font:inherit;font-size:.95rem;background:#fff;color:#4a3728">
</div>
<canvas id="cv" width="900" height="600"></canvas>
<div id="ov"
	style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:12px"
	onclick="this.style.display='none'">
	<img id="ovimg" alt="rendered meme" style="max-width:90vw;max-height:80vh;border-radius:8px;background:#fff">
	<div style="color:#fff;font-size:.9rem;text-align:center;padding:0 16px">right-click / long-press the image → “Save
		image as…” &nbsp;·&nbsp; click anywhere to close</div>
</div>

	});
	cv.addEventListener('pointermove', e => {
		if (!drag) return; const p = pt(e);
		if (drag.all) {for (const q of P) {q[0] += p[0] - drag.last[0]; q[1] += p[1] - drag.last[1]} drag.last = p}
		else {P[drag.i][0] = p[0]; P[drag.i][1] = p[1]}
		draw();
	});
	cv.addEventListener('pointerup', () => drag = null);
	document.getElementById('pk-photo').onclick = () => setShrimp('photo');
	document.getElementById('pk-cartoon').onclick = () => setShrimp('cartoon');
	document.getElementById('reset').onclick = resetPose;
	document.getElementById('size').oninput = e => {
		const f = +e.target.value / lastSize; lastSize = +e.target.value;
		const mx = P.reduce((s, p) => s + p[0], 0) / P.length, my = P.reduce((s, p) => s + p[1], 0) / P.length;
		for (const p of P) {p[0] = mx + (p[0] - mx) * f; p[1] = my + (p[1] - my) * f}
		draw();
	};
	document.getElementById('rot').oninput = e => {
		const a = (+e.target.value - lastRot) * Math.PI / 180; lastRot = +e.target.value;
		const c = Math.cos(a), s = Math.sin(a);
		const mx = P.reduce((t, p) => t + p[0], 0) / P.length, my = P.reduce((t, p) => t + p[1], 0) / P.length;
		for (const p of P) {
			const x = p[0] - mx, y = p[1] - my;
			p[0] = mx + x * c - y * s; p[1] = my + x * s + y * c;
		}
		draw();
	};
	document.getElementById('file').onchange = e => {
		const f = e.target.files[0]; if (!f) return;
		const img = new Image();
		img.onload = () => {bgImg = img; draw()};
		img.src = URL.createObjectURL(f);
	};
	document.getElementById('save').onclick = () => {
		draw(false);
		const url = cv.toDataURL('image/png');
		draw();
		const a = document.createElement('a'); a.download = 'sitting-like-a-shrimp.png'; a.href = url; a.click();
		// sandboxed iframes (like the hosted artifact) block downloads — show the image to save manually
		document.getElementById('ovimg').src = url;
		document.getElementById('ov').style.display = 'flex';
	};
	document.getElementById('cap').oninput = () => draw();
	setShrimp('photo');
</script>
